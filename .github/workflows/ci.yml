name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No file paths that differ only by case
        run: "! git ls-files | sort -f | uniq -di | grep ."
      - name: Lint Python
        run: pipx run ruff==0.17.2 check .
