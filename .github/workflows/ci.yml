name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # Blender 5.2's Python
      - name: No file paths that differ only by case
        run: "! git ls-files | sort -f | uniq -di | grep ."
      - run: pip install ruff==0.17.2 pytest==9.1.1 jsonschema==4.26.0
      - run: ruff check .
      - run: pytest tests
      - name: Capture helper tests (no desktop is captured; Windows-only cases skip)
        run: |
          pip install Pillow==12.3.0 numpy==2.5.4 opencv-python-headless==5.0.0.93
          python -m unittest discover -s desktop-capture -p 'test_*.py' -v

  voicecore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # The pinned Vosk model, so the real-recognition tests run instead of skipping.
      - uses: actions/cache@v6
        with:
          path: voice/models
          key: vosk-model-${{ hashFiles('voice/fetch-model.sh') }}
      - run: voice/fetch-model.sh
      - run: dotnet test tests/voice
