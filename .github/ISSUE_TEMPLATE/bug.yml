name: Bug report
description: Something that worked, or should work, does not.
labels: ["bug"]
projects: ["waaberi/3"]
body:
  - type: input
    id: build
    attributes:
      label: Build or commit
      description: Exact build ID or commit SHA you tested.
    validations:
      required: true
  - type: checkboxes
    id: devices
    attributes:
      label: Where it happened
      options:
        - label: Talia PC (host Blender, Unity app)
        - label: Quest 3S over Air Link
        - label: Lee Jae-yeon PC (remote Blender)
        - label: Jihyeon Mac (Unity Editor / simulation)
        - label: Waaberi Linux (backend / voice tests)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include whether the native Blender document changed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or console errors
