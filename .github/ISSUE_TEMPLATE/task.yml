name: Task
description: A piece of work for the board. Use the plan's task ID if there is one.
projects: ["waaberi/3"]
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: From PHASE_PLAN.md, e.g. P2-W-3. Leave blank for new work.
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - Waaberi
        - Lee Jae-yeon
        - Jihyeon
        - Talia
        - Team
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to do
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable result that proves the step works.
    validations:
      required: true
