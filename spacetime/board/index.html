<!doctype html>
<!-- The session board's page. server.ts serves it and pushes the state over /events. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Modeling · Session board</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #151922; --line: #232938; --text: #e8ebf2; --dim: #8a93a8;
    --pink: #ff4fa3; --pink-soft: rgba(255, 79, 163, .14); --green: #3ddc97; --red: #ff6b6b;
    --blue: #6aa8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 22px 32px;
           border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .source { margin-left: auto; color: var(--dim); font-size: 14px; display: flex; gap: 10px;
            align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  .dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(61, 220, 151, .6);
              animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(61, 220, 151, 0); }
                     100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0); } }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  main { display: grid; grid-template-columns: 1fr 1.4fr 1.6fr; gap: 20px; padding: 24px 32px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
            padding: 18px 20px; min-height: 260px; }
  h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; text-transform: uppercase;
       letter-spacing: .08em; color: var(--dim); }
  .empty { color: var(--dim); font-style: italic; }
  .person { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
            font-weight: 700; background: #232a3a; color: var(--text); flex: none; }
  .avatar.editing { background: var(--pink); color: #1a0010; }
  .role { color: var(--dim); font-size: 13px; }
  .lease { border: 1px solid var(--pink); background: var(--pink-soft); border-radius: 12px;
           padding: 14px 16px; margin-bottom: 12px; }
  .lease .who { color: var(--pink); font-weight: 700; }
  .lease .what { font-size: 19px; font-weight: 600; margin-top: 2px; }
  .lease .meta { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .event { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 9px 0;
           border-bottom: 1px solid var(--line); }
  .new { animation: arrive .35s ease-out; }
  .event:last-child { border-bottom: 0; }
  .event .icon { font-weight: 800; text-align: center; }
  .event.grant .icon { color: var(--pink); } .event.refusal .icon { color: var(--red); }
  .event.join .icon { color: var(--green); } .event.leave .icon, .event.release .icon { color: var(--dim); }
  .event.refusal .text { color: #ffd0d0; }
  .event .when { color: var(--dim); font-size: 13px; white-space: nowrap; text-align: right; }
  .fast { color: var(--blue); }
  @keyframes arrive { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  footer { padding: 0 32px 26px; color: var(--dim); font-size: 13px; }
  .problem { margin: 0 32px; padding: 12px 16px; border-radius: 10px; background: rgba(255, 107, 107, .12);
             border: 1px solid var(--red); color: #ffd0d0; display: none; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Session board</h1>
  <div class="source"><span class="dot" id="dot"></span><span id="source">Connecting to SpacetimeDB…</span></div>
</header>
<p class="problem" id="problem"></p>
<main>
  <section><h2>Here now</h2><div id="people"></div></section>
  <section><h2>Editing</h2><div id="leases"></div></section>
  <section><h2>SpacetimeDB decisions</h2><div id="events"></div></section>
</main>
<footer>
  Every row on this page arrives by a live SpacetimeDB subscription
  (<code>participant</code>, <code>lease</code>, <code>label</code>, <code>refusal</code>).
  The module's <code>acquire</code> reducer decides who may edit what; Blender asks it and obeys.
</footer>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ROLES = { vr: 'in VR', 'blender-client': 'remote Blender', host: 'host Blender' };
  const ICONS = { grant: '●', refusal: '✕', join: '+', leave: '−', release: '○' };
  const ago = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
                      return s < 5 ? 'now' : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`; };
  let last = null;
  const seen = new Set(); // what has been shown, so only new cards and decisions animate
  let opened = true; // what is there when the page opens doesn't animate
  const fresh = key => { const isNew = !seen.has(key); seen.add(key); return isNew && !opened ? ' new' : ''; };

  function render(st) {
    last = st;
    $('dot').className = 'dot' + (st.connected ? ' live' : '');
    $('source').innerHTML = st.connected
      ? `Live from SpacetimeDB · <code>${esc(st.database)}</code> at <code>${esc(st.url)}</code>`
      : 'Not connected to SpacetimeDB';
    $('problem').style.display = st.problem ? 'block' : 'none';
    $('problem').textContent = st.problem;

    const editing = new Set(st.leases.map(l => l.ownerId));
    $('people').innerHTML = st.participants.length ? st.participants.map(p => `
      <div class="person"><div class="avatar${editing.has(p.id) ? ' editing' : ''}">${esc(p.name[0] || '?').toUpperCase()}</div>
      <div><div>${esc(p.name)}</div><div class="role">${esc(ROLES[p.role] || p.role)}${editing.has(p.id) ? ' · editing' : ''}</div></div></div>`).join('')
      : '<p class="empty">Nobody yet. Start the host Blender.</p>';

    $('leases').innerHTML = st.leases.length ? st.leases.map(l => `
      <div class="lease${fresh('lease' + l.id)}"><div class="who">${esc(l.owner)} is editing</div>
      <div class="what">${esc(l.what)}</div>
      <div class="meta">${l.mode === 'exclusive' ? 'Exclusive: nobody else can change the document' : 'Shared: others can edit other objects'} · since ${ago(l.since)}</div></div>`).join('')
      : '<p class="empty">Nobody is editing. Everything is free.</p>';

    $('events').innerHTML = st.events.length ? st.events.map(e => `
      <div class="event ${esc(e.kind)}${fresh('event' + e.id)}"><div class="icon">${ICONS[e.kind] || '·'}</div>
      <div class="text">${esc(e.text)}</div>
      <div class="when">${e.pushedMs !== null ? `<span class="fast">pushed in ${e.pushedMs} ms</span><br>` : ''}${ago(e.at)}</div></div>`).join('')
      : '<p class="empty">Decisions appear here as they happen.</p>';
    opened = false;
  }

  function listen() {
    const source = new EventSource('/events');
    source.onmessage = m => render(JSON.parse(m.data));
    source.onerror = () => { $('dot').className = 'dot'; $('source').textContent = 'The board server stopped'; };
  }
  setInterval(() => last && render(last), 5000);
  listen();
</script>
</body>
</html>
